<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 148 44" width="148" height="44" role="img" aria-label="GitHub: Abhijeet-Dashy">
<title>GitHub: Abhijeet-Dashy</title>
<defs><style>@font-face{font-family:'GDisplay';src:url(data:font/woff2;base64,) format('woff2');}
.d{font-family:'GDisplay',Geist,Inter,system-ui,sans-serif;font-weight:500;}
.s{font-family:'GSans',Geist,Inter,system-ui,sans-serif;}
.m{font-family:'GMono','Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;}
.rise{animation:rise 720ms cubic-bezier(.22,1,.36,1) both;}
@keyframes rise{0%{opacity:0;transform:translateY(14px);}}
.word{animation:word 900ms cubic-bezier(.22,1,.36,1) both;}
@keyframes word{0%{opacity:0;transform:translateY(.32em);filter:blur(10px);}}
.fadein{animation:fadein 1400ms cubic-bezier(.22,1,.36,1) both;}
@keyframes fadein{0%{opacity:0;}}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1200ms cubic-bezier(.22,1,.36,1) both;}
.growc{transform-box:fill-box;transform-origin:center;animation:grow 1400ms cubic-bezier(.22,1,.36,1) both;}
@keyframes grow{0%{transform:scaleX(0);}}
.draw{stroke-dasharray:1;animation:draw 2600ms cubic-bezier(.22,1,.36,1) both;}
@keyframes draw{0%{stroke-dashoffset:1;}}
.pulse{animation:pulse 4.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.45;}50%{opacity:1;}}
.float{animation:float 9s ease-in-out infinite;}
@keyframes float{0%{opacity:0;transform:translateY(8px);}30%{opacity:.9;}100%{opacity:0;transform:translateY(-34px);}}
.sway{transform-box:view-box;transform-origin:var(--ox) 0;animation:sway 7s ease-in-out infinite;}
@keyframes sway{0%,100%{transform:rotate(-1.6deg);}50%{transform:rotate(1.6deg);}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;}}
</style></defs>
